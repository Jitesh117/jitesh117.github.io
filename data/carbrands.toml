# Brands for the diecast collection (content/hotwheels.md, {{< car brand="..." >}}).
# name:    label shown on the card
# color:   logo colour (tuned to read well on the dark theme; official colours that are black/navy are lightened)
# logo:    true if static/images/brands/<key>.svg exists (single-colour; drawn in `color` via an SVG sprite)
# logoImg: file in static/images/brands/ shown as-is (for multi-colour logos)
# Neither: the Hot Wheels logo is shown as a fallback.
# Sources: Simple Icons (CC0); batman, hotwheels, dodge, cupra, mercury from Wikimedia Commons (public domain, cleaned to plain shapes).

