# Site Configuration
baseURL = 'jitesh117.github.io/'
languageCode = "en-us"
title = "Jitesh's Blog"
theme = "PaperMod"
cover_image = "images/cover.jpeg"
googleAnalytics = "G-CGJ4KC5CSM"
buildFuture = true

# Output Formats
[outputs]
  home = ['html', 'rss', 'json', 'graph']
  section = ['html', 'rss']
  taxonomy = ['html']
  term = ['html']

# Expose static/images to Hugo's image processing (resized WebP copies are generated at build
# time by layouts/partials/img_src.html); the originals are still published at /images/...
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"

# Lightweight data for the graph view (posts, tags and post-to-post links): /graph.json
[outputFormats.graph]
  mediaType = "application/json"
  baseName = "graph"
  isPlainText = true
  notAlternative = true

# Site Parameters
[params]
  mainSections = ["blog", "musings", "vim_stuff"]
  hideSummary = true
  comments = true
  archives = true
  archiveSection = ["blog", "musings", "vim_stuff"]
  defaultTheme = "dark"
  disableThemeToggle = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPageNums = true
  search = true
  searchPlaceholder = "Search..."
  disableScrollToTop = true

  # SEO / social previews (used for meta description, og:* and twitter:* on pages without their own)
  description = "Jitesh builds things to understand them: distributed systems papers rebuilt in Go, an interpreter from scratch, Vim deep dives, essays on being a developer, and Vim Royale, a multiplayer Vim game."
  images = ["images/cover.jpeg"]
  newsletterPromise = "New posts on building systems from scratch in Go, plus Vim tips, straight to your inbox. No spam, unsubscribe anytime."

  # Homepage "Start here" list (page paths, in display order)
  startHere = [
    "/blog/implementing-mapreduce-in-golang",
    "/blog/implementing-tail-at-scale-in-golang",
    "/blog/implementing-google-bigtable-in-golang",
    "/blog/google-file-system-in-go",
  ]

  [params.social]
    twitter = "Jitesh_117"

  [params.vimRoyale]
    url = "https://vimroyale.com/"


  # Home Page Information
  [params.homeInfoParams]
Title = "{{< terminal-prompt >}}"
Content = "### Hey! I'm Jitesh\n I build distributed systems and dev tools from scratch in Go, write about Vim, and made a multiplayer Vim game."

  # Social Icons
  [[params.socialIcons]]
  name = "github"
  url = "https://github.com/Jitesh117"

  [[params.socialIcons]]
  name = "email"
  url = "mailto:sahookumarjitesh@gmail.com"

  [[params.socialIcons]]
  name = "twitter"
  url = "https://x.com/Jitesh_117"

  [[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/Jitesh117/"

  [[params.socialIcons]]
  name = "kaggle"
  url = "https://www.kaggle.com/jiteshkumarsahoo"

  [[params.socialIcons]]
  name = "buymeacoffee"
  url = "https://buymeacoffee.com/jitesh117"

  [[params.socialIcons]]
  name = "RSS"
  url = "https://jiteshcodes.com/index.xml"

  # Cover Image Parameters
  [params.cover]
  linkFullImages = true

  # Search Settings
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1_000
    threshold = 0.4
    minMatchCharLength = 0
    keys = [ "title", "permalink", "summary", "content" ]

# Menu Configuration
[[menu.main]]
